<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Désinscription · Kay Charly</title>
<style>
:root{--ink:#16201b;--green:#1b4234;--sun:#f2b53a;--cream:#f6efe2;--muted:#65716a}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.5 Arial,Helvetica,sans-serif}
header{background:#0b1a14;color:#fff8e9;padding:20px 22px;border-bottom:6px solid var(--sun)}header a{color:inherit;text-decoration:none;font:700 26px Georgia,serif}
main{max-width:560px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:18px;padding:26px 22px;box-shadow:0 6px 24px #0001;text-align:center}
h1{font:400 28px/1.2 Georgia,serif;margin:0 0 10px}.muted{color:var(--muted)}.err{color:#a82c22;font-weight:700}
.btn{display:inline-block;border:0;border-radius:999px;background:var(--green);color:#fff;font:700 18px Arial,sans-serif;padding:15px 28px;cursor:pointer;text-decoration:none;margin:6px}.btn.alt{background:#fff;color:var(--green);border:2px solid var(--green)}
</style>
<header><a href="./">Kay Charly</a></header>
<main><div class="card" id="card">
  <h1>Ne plus recevoir nos e-mails ?</h1>
  <p class="muted">Vous ne recevrez plus le menu du jour ni les demandes d’avis. Les confirmations de vos prochaines commandes continueront d’arriver.</p>
  <button class="btn" id="go" type="button">Me désinscrire</button> <a class="btn alt" href="./">Annuler</a>
  <p id="msg" role="status"></p>
</div></main>
<script src="backend.js"></script>
<script>
'use strict';
// A button (not automatic on page load), so email link scanners cannot unsubscribe someone by mistake.
const token = new URLSearchParams(location.search).get('t') || '', card = document.getElementById('card');
const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rpc = (fn, body) => KC.api('/rest/v1/rpc/' + fn, { method: 'POST', body });
document.getElementById('go').onclick = async (e) => {
  e.target.disabled = true;
  try {
    if (!/^[0-9a-f-]{36}$/i.test(token)) throw Error('Lien invalide');
    const who = await rpc('kc_unsubscribe', { p_token: token });
    card.innerHTML = `<h1>C’est fait ✓</h1><p>${h(who)} ne recevra plus nos e-mails.</p><p class="muted">Une erreur ?</p><button class="btn alt" id="back" type="button">Me réinscrire</button> <a class="btn" href="./">Voir la carte</a><p id="msg2" role="status"></p>`;
    document.getElementById('back').onclick = async (ev) => {
      ev.target.disabled = true;
      try { await rpc('kc_resubscribe', { p_token: token }); card.innerHTML = '<h1>Réinscrit ✓</h1><p>Vous recevrez de nouveau le menu du jour.</p><a class="btn" href="./">Voir la carte</a>'; }
      catch (err) { document.getElementById('msg2').innerHTML = `<span class="err">${h(err.message)}</span>`; ev.target.disabled = false; }
    };
  } catch (err) { document.getElementById('msg').innerHTML = `<span class="err">${h(err.message)}. Écrivez-nous en répondant à l’e-mail, nous le ferons pour vous.</span>`; e.target.disabled = false; }
};
</script>
