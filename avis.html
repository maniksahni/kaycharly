<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Votre avis · Kay Charly</title>
<style>
:root{--ink:#16201b;--green:#1b4234;--sun:#f2b53a;--cream:#f6efe2;--muted:#65716a}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.5 Arial,Helvetica,sans-serif}
header{background:#0b1a14;color:#fff8e9;padding:20px 22px;border-bottom:6px solid var(--sun)}header a{color:inherit;text-decoration:none;font:700 26px Georgia,serif}
main{max-width:560px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:18px;padding:26px 22px;box-shadow:0 6px 24px #0001;text-align:center}
h1{font:400 30px/1.2 Georgia,serif;margin:0 0 8px}.muted{color:var(--muted)}
.stars{display:flex;justify-content:center;gap:6px;margin:18px 0 6px}.stars button{font-size:46px;line-height:1;background:none;border:0;cursor:pointer;color:#d9d2c3;padding:4px;min-width:56px;min-height:56px}.stars button.on{color:#e0a020}
.hint{min-height:1.5em;font-weight:700;color:var(--green)}
textarea{width:100%;min-height:110px;margin:14px 0;padding:12px;border:1px solid #cfc5b0;border-radius:12px;font:inherit}
.btn{display:inline-block;border:0;border-radius:999px;background:var(--green);color:#fff;font:700 18px Arial,sans-serif;padding:15px 28px;cursor:pointer;text-decoration:none}.btn.alt{background:#fff;color:var(--green);border:2px solid var(--green)}
.items{text-align:left;margin:16px auto 0;padding:12px 14px;background:#f8f2e7;border-radius:12px;font-size:15px;max-width:420px}
.err{color:#a82c22;font-weight:700}
</style>
<header><a href="./">Kay Charly</a></header>
<main><div class="card" id="card"><p class="muted">Chargement…</p></div></main>
<script src="backend.js"></script>
<script>
'use strict';
const q = new URLSearchParams(location.search), ref = q.get('r') || '', token = q.get('t') || '';
const card = document.getElementById('card');
const h = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LABEL = ['', 'Pas content', 'Bof', 'Bien', 'Très bien', 'Excellent !'];
const REVIEW_URL = 'https://www.google.com/maps/search/?api=1&query=Kay+Charly+19+rue+de+la+Marivoise+91750+Champcueil';
let rating = Math.min(5, Math.max(0, parseInt(q.get('n') || '0', 10) || 0)), info = null;
const rpc = (fn, body) => KC.api('/rest/v1/rpc/' + fn, { method: 'POST', body });

function form() {
  card.innerHTML = `<h1>Merci${info.first_name ? ' ' + h(info.first_name) : ''} !</h1><p class="muted">Comment était votre repas ?</p>
    <div class="stars" role="radiogroup" aria-label="Note de 1 à 5">${[1, 2, 3, 4, 5].map((n) => `<button type="button" role="radio" aria-checked="${n === rating}" aria-label="${n} sur 5" data-n="${n}" class="${n <= rating ? 'on' : ''}">★</button>`).join('')}</div>
    <div class="hint" id="hint">${LABEL[rating] || 'Touchez une étoile'}</div>
    <textarea id="comment" maxlength="1000" placeholder="Un mot pour Kay Charly ? (facultatif)">${h(info.comment || '')}</textarea>
    <button class="btn" id="send" type="button">Envoyer mon avis</button><p id="msg" role="status"></p>
    <div class="items"><b>Votre commande</b><br>${(info.items || []).map((i) => `${i.quantity} × ${h(i.name)}`).join('<br>')}</div>`;
  card.querySelector('.stars').onclick = (e) => { const b = e.target.closest('[data-n]'); if (!b) return; rating = +b.dataset.n; card.querySelectorAll('.stars button').forEach((x) => { x.classList.toggle('on', +x.dataset.n <= rating); x.setAttribute('aria-checked', String(+x.dataset.n === rating)); }); document.getElementById('hint').textContent = LABEL[rating]; };
  document.getElementById('send').onclick = submit;
}
async function submit() {
  const msg = document.getElementById('msg');
  if (!rating) { msg.innerHTML = '<span class="err">Touchez une étoile pour donner votre note.</span>'; return; }
  const btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'Envoi…';
  try {
    await rpc('kc_feedback_submit', { p_reference: ref, p_token: token, p_rating: rating, p_comment: document.getElementById('comment').value });
    card.innerHTML = `<h1>Merci pour votre avis ${'★'.repeat(rating)}</h1>`
      + (rating >= 4
        ? `<p>Ça nous fait très plaisir ! Pourriez-vous aussi le dire sur Google ? Cela aide beaucoup un petit restaurant.</p><p><a class="btn" href="${REVIEW_URL}" target="_blank" rel="noopener">Laisser un avis Google</a></p>`
        : `<p>Merci de nous l’avoir dit. Kay Charly lit chaque message et vous recontactera si besoin.</p><p class="muted">Vous pouvez aussi appeler le <a href="tel:+33760629572">07 60 62 95 72</a>.</p>`)
      + `<p><a class="btn alt" href="./">Voir la carte</a></p>`;
  } catch (e) { btn.disabled = false; btn.textContent = 'Envoyer mon avis'; msg.innerHTML = `<span class="err">${h(e.message)}</span>`; }
}
(async () => {
  try {
    if (!/^KC-[A-F0-9]{10}$/.test(ref) || !/^[0-9a-f-]{36}$/i.test(token)) throw Error();
    info = await rpc('kc_feedback_get', { p_reference: ref, p_token: token });
    if (!info) throw Error();
    if (!q.get('n') && info.rating) rating = info.rating;
    form();
  } catch { card.innerHTML = '<h1>Lien expiré</h1><p class="muted">Ce lien d’avis n’est pas valide. Merci quand même ! Vous pouvez nous joindre au 07 60 62 95 72.</p><p><a class="btn" href="./">Voir la carte</a></p>'; }
})();
</script>
